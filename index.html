<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080504" id="tc">
<title>Jaskyňa</title>
<meta name="description" content="Úlohy a poznámky v rytme slnka.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaskyňa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* set from the sun's position by JS; these are the night values */
    --black:#080504; --dial:#120C09; --raise:#1A110C; --hair:#26190F;
    --ivory:#D9A27A; --ash:#8A6248; --ash2:#4A3324;
    --gold:#D9733F; --gold-hi:#D9733F; --gold-lo:#6B3A20; --ember:#B9483A; --onacc:#080504;
    --sky1:#080504; --sky2:#140B07; --ridge1:#1A100B; --ridge2:#110A07; --orb:#C9A07A; --track:rgba(217,162,122,.14);
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--black);color:var(--ivory);overflow:hidden;
    font-family:"Jost",-apple-system,system-ui,sans-serif;font-weight:400;font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums}
  button,input,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:1px solid var(--gold);outline-offset:3px}

  .app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
  .app{isolation:isolate}
  .sky{position:absolute;left:0;right:0;top:0;height:300px;z-index:-1;pointer-events:none;
       background:linear-gradient(to bottom,var(--sky1) 0%,var(--sky2) 85%);transition:background 1.2s}
  .sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
  .sky .r1{fill:var(--ridge1)} .sky .r2{fill:var(--ridge2)}
  .sky .fade{fill:url(#skyfade)}
  .sky .r0{fill:var(--ridge0)}
  .sky .r2.back{opacity:.72}
  .vista{height:66px}
  .fwrap{background:var(--black);transition:background-color 1.2s}
  .flist{background:var(--black);min-height:60vh;transition:background-color 1.2s}
  #pNotes{background:var(--black);transition:background-color 1.2s}
  .sky .body{transition:transform 1.2s cubic-bezier(.3,.8,.2,1),opacity 1.2s}
  .sky .sunc{fill:var(--orb)}
  .sky .moonlit{fill:var(--moon)}
  .sky .moondark{fill:var(--sky1)}
  .sky .crater{fill:var(--sky2)}
  .sky .st{fill:var(--star)}
  .sky .st.tw{animation:tw 3.6s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:1}to{opacity:.3}}
  .sky #stars,.sky .mist,.sky .cloud,.sky #hglow{transition:opacity 1.2s}
  .sky .mist{fill:var(--mist)}
  .sky .cloud{fill:var(--cloud)}
  .sky .drift1{animation:drift 46s ease-in-out infinite alternate}
  .sky .drift2{animation:drift 63s ease-in-out infinite alternate-reverse}
  .sky .drift3{animation:drift 90s linear infinite alternate}
  @keyframes drift{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
  .sky #shoot{stroke:var(--star);stroke-width:1.1;stroke-linecap:round;opacity:0}
  body,.bar,.sheet,.menu,.snack,.sbar,.task .t,.gh,.filters button,.htxt,.note{transition:background-color 1.2s,color 1.2s,border-color 1.2s}
  .switch .sun{margin-left:auto;font-size:12.5px;color:var(--ash);padding-bottom:13px;white-space:nowrap}
  .switch .sun.prev{color:var(--gold)}

  /* top switch: like the crown positions */
  .switch{flex:0 0 auto;display:flex;align-items:flex-end;gap:26px;padding:calc(env(safe-area-inset-top) + 18px) 22px 0;position:relative}
  .switch button{font-size:22px;font-weight:300;color:var(--ash2);padding-bottom:10px;transition:color .3s;letter-spacing:.2px}
  .switch button.on{color:var(--ivory)}
  .switch .line{position:absolute;bottom:0;height:1px;background:var(--gold);transition:left .1s linear,width .1s linear}
  .switch::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;background:var(--hair);z-index:-1}

  .pager{flex:1;display:flex;overflow:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
  .pager::-webkit-scrollbar{display:none}
  .panel{flex:0 0 100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}

  /* the dial */
  .head{display:flex;align-items:center;gap:18px;padding:20px 22px 16px}
  .dial{flex:0 0 132px;height:132px}
  .dial svg{width:100%;height:100%;display:block;overflow:visible}
  .htxt .d{font-size:21px;font-weight:300;letter-spacing:.2px}
  .htxt .r{font-size:14px;color:var(--ash);margin-top:6px;line-height:1.45}
  .htxt .r em{font-style:normal;color:var(--gold)}

  /* filters */
  .filters{display:flex;gap:18px;padding:0 22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hair)}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:0 0 auto;font-size:14px;color:var(--ash);padding:9px 0 10px;position:relative;white-space:nowrap}
  .filters button.on{color:var(--ivory)}
  .filters button.on::after{content:"";position:absolute;left:50%;bottom:-1px;width:5px;height:5px;background:var(--gold);transform:translate(-50%,50%) rotate(45deg)}
  .filters{overflow:visible;justify-content:space-between;gap:0}
  .lbtn{display:flex;align-items:center;gap:6px}
  .lbtn svg{width:9px;height:6px;stroke:currentColor;stroke-width:1.4;fill:none;transition:transform .25s}
  .lbtn.open svg{transform:rotate(180deg)}
  .fwrap{position:relative}
  .menu{position:absolute;right:16px;top:calc(100% + 6px);z-index:7;min-width:190px;background:var(--raise);border:1px solid var(--hair);border-radius:12px;padding:6px 0;
        opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s}
  .menu.on{opacity:1;transform:none;pointer-events:auto}
  .menu button{display:flex;justify-content:space-between;width:100%;padding:11px 16px;font-size:15px;color:var(--ivory);text-align:left}
  .menu button span{color:var(--ash2);font-size:13px}
  .menu button.on{color:var(--gold)}
  .flist{will-change:transform}
  .flist.inL{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
  .flist.inR{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes inL{from{transform:translateX(38%);opacity:0}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(-38%);opacity:0}to{transform:none;opacity:1}}
  .filters sup{font-size:10px;color:var(--ash2);margin-left:3px;vertical-align:4px}

  /* compact task rows */
  .gh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ash);padding:16px 22px 4px}
  .gh.late{color:var(--ember)}
  .task{display:flex;align-items:center;min-height:46px;padding:0 22px 0 0;position:relative;transition:opacity .25s,max-height .3s;max-height:90px;overflow:hidden}
  .task .mk{flex:0 0 22px;align-self:stretch;position:relative}
  .task.hi .mk::before{content:"";position:absolute;left:0;top:50%;width:9px;height:2px;background:var(--gold);transform:translateY(-50%)}
  .chk{overflow:visible;flex:0 0 20px;height:20px;border-radius:50%;border:1px solid var(--ash2);position:relative;margin-right:14px;transition:border-color .2s}
  .chk::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--gold);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
  .task.hi .chk{border-color:var(--gold-lo)}
  .task.done .chk{border-color:var(--gold)}
  .task.done .chk::after{transform:scale(1)}
  .task .bd{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer}
  .task:last-child .bd{border-bottom:0}
  .task .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .task .ls{font-size:12.5px;color:var(--ash2)}
  .task .du{font-size:13px;color:var(--ash);flex:0 0 auto}
  .task .du.tm{color:var(--ivory);opacity:.75}
  .task .du.late{color:var(--ember)} .task .du.today{color:var(--gold)}
  .task.done .t{color:var(--ash2);text-decoration:line-through;text-decoration-thickness:1px}
  .task.gone{max-height:0;opacity:0}
  .rip{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:1px solid var(--gold);pointer-events:none;animation:rip .7s cubic-bezier(.2,.7,.3,1) forwards}
  .rip.b{animation-delay:.08s;border-color:var(--gold);opacity:0}
  @keyframes rip{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
  .task.flash .t{background:linear-gradient(100deg,var(--ash2) 0 35%,var(--gold-hi) 50%,var(--ash2) 65% 100%);background-size:300% 100%;
     -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen .8s ease-out forwards}
  @keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
  .dial svg{transition:filter .6s}
  .dial.glow svg{animation:glow 1.1s ease-out}
  .dial.glow.all svg{animation:glow 1.8s ease-out}
  @keyframes glow{0%{filter:drop-shadow(0 0 0 transparent)}25%{filter:drop-shadow(0 0 9px var(--gold))}100%{filter:drop-shadow(0 0 0 transparent)}}
  .more{display:block;padding:14px 22px;font-size:13px;color:var(--ash)}
  .empty{padding:36px 22px;color:var(--ash);font-size:15px;line-height:1.5}
  .empty b{display:block;color:var(--ivory);font-weight:400;font-size:18px;margin-bottom:2px}

  /* notes */
  .nsearch{display:flex;align-items:center;gap:10px;margin:18px 22px 6px;border-bottom:1px solid var(--hair);padding-bottom:9px}
  .nsearch svg{width:15px;height:15px;stroke:var(--ash);fill:none;stroke-width:1.4}
  .nsearch input{flex:1;background:none;border:0;outline:none;font-size:15px}
  .nsearch input::placeholder{color:var(--ash2)}
  .note{display:flex;gap:14px;width:100%;text-align:left;padding:13px 22px 13px 0;align-items:flex-start}
  .note .mk{flex:0 0 22px;position:relative;align-self:stretch}
  .note.pin .mk::before{content:"";position:absolute;left:0;top:12px;width:9px;height:2px;background:var(--gold)}
  .note .w{flex:1;min-width:0;border-bottom:1px solid var(--hair);padding-bottom:13px;margin-bottom:-13px}
  .note:last-child .w{border-bottom:0}
  .note .top{display:flex;gap:12px;align-items:baseline}
  .note .nt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .note .tm{font-size:12.5px;color:var(--ash2)}
  .note .pv{font-size:14px;color:var(--ash);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}

  /* bottom input */
  .dock{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
        background:linear-gradient(to top,var(--black) 65%,transparent)}
  .bar{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--dial);border-radius:24px;padding:4px 4px 4px 18px;transition:border-color .25s}
  .bar:focus-within{border-color:var(--gold-lo)}
  .bar input{flex:1;background:none;border:0;outline:none;font-size:16px;padding:9px 0}
  .bar input::placeholder{color:var(--ash2)}
  .bar .go{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--onacc);display:grid;place-items:center}
  .bar .go svg{width:16px;height:16px;stroke:var(--onacc);stroke-width:1.8;fill:none}
  .parse{font-size:12.5px;color:var(--ash2);padding:6px 18px 0;min-height:22px}
  .parse b{font-weight:400;color:var(--gold)}

  /* sheets */
  .shade{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
  .shade.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--dial);border-top:1px solid var(--gold-lo);border-radius:20px 20px 0 0;
         transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1);max-height:calc(100% - env(safe-area-inset-top) - 20px);overflow-y:auto;
         padding:0 22px calc(env(safe-area-inset-bottom) + 22px)}
  .sheet.full{height:calc(100% - env(safe-area-inset-top) - 20px)}
  .sheet.on{transform:none}
  .sbar{display:flex;justify-content:space-between;align-items:center;height:54px;position:sticky;top:0;background:var(--dial);z-index:1}
  .sbar button{color:var(--gold);font-size:15px}
  .sbar .l{color:var(--ash)}
  .ti{width:100%;background:none;border:0;outline:none;font-size:24px;font-weight:300;padding:6px 0 12px;border-bottom:1px solid var(--hair)}
  .tx{width:100%;background:none;border:0;outline:none;resize:none;font-size:16px;line-height:1.55;font-weight:300;padding-top:12px;min-height:90px}
  .sheet.full .tx{min-height:calc(100vh - 220px)}
  .ti::placeholder,.tx::placeholder{color:var(--ash2)}
  .opt{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--hair);gap:12px}
  .opt>span{color:var(--ash);font-size:14px}
  .ch{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .ch button{font-size:14px;color:var(--ash);position:relative;padding:2px 0}
  .ch button.on{color:var(--gold)}
  .time{background:none;border:1px solid var(--hair);border-radius:8px;padding:5px 8px;color:var(--ivory);font-size:14px;color-scheme:light dark}
  .cal{color:var(--gold);font-size:14px;text-decoration:none;cursor:pointer;background:none;border:0;padding:2px 0}
  .cal.off{color:var(--ash2)} .cal.done{color:var(--ash)}
  .bk{font-size:14px;color:var(--ash);line-height:1.5;padding:6px 0 14px;font-weight:300}
  .bkw{font-size:12px;color:var(--ash2)}
  .bk.small{font-size:13px;color:var(--gold);padding-top:10px}
  .more.foot{color:var(--ash2);margin-top:18px}
  .del{color:var(--ember);font-size:14px;padding:18px 0 4px}

  .snack{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:8;border:1px solid var(--hair);background:var(--raise);border-radius:14px;
         padding:12px 16px;display:flex;justify-content:space-between;font-size:14px;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .28s}
  .snack.on{opacity:1;transform:none;pointer-events:auto}
  .snack button{color:var(--gold)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sky" aria-hidden="true"><svg viewBox="0 0 430 300" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="skyfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--black)" stop-opacity="0"/><stop offset="1" style="stop-color:var(--black)"/></linearGradient>
      <radialGradient id="gSun"><stop offset="0" style="stop-color:var(--orb)" stop-opacity=".5"/><stop offset=".3" style="stop-color:var(--orb)" stop-opacity=".16"/><stop offset="1" style="stop-color:var(--orb)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gMoon"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".35"/><stop offset=".35" style="stop-color:var(--moon)" stop-opacity=".09"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gHz" cx=".5" cy="1" r=".75"><stop offset="0" style="stop-color:var(--orb)" stop-opacity=".55"/><stop offset=".5" style="stop-color:var(--orb)" stop-opacity=".14"/><stop offset="1" style="stop-color:var(--orb)" stop-opacity="0"/></radialGradient>
      <filter id="fMist" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
      <clipPath id="moonClip"><path id="moonClipP"/></clipPath>
    </defs>
    <g id="stars"></g>
    <line id="shoot" x1="0" y1="0" x2="0" y2="0"/>
    <g class="drift3"><ellipse class="cloud" id="cl1" cx="110" cy="70" rx="70" ry="6" filter="url(#fMist)"/><ellipse class="cloud" id="cl2" cx="310" cy="112" rx="90" ry="5" filter="url(#fMist)"/></g>
    <ellipse id="hglow" cx="215" cy="230" rx="190" ry="80" fill="url(#gHz)"/>
    <g id="sunG" class="body"><circle r="38" fill="url(#gSun)"/><circle class="sunc" r="8.5"/></g>
    <g id="moonG" class="body">
      <circle id="moonHalo" r="30" fill="url(#gMoon)"/>
      <circle class="moondark" id="moonDark" r="7.5"/>
      <path class="moonlit" id="moonLit"/>
      <g clip-path="url(#moonClip)" opacity=".22"><circle class="crater" cx="-2.4" cy="-2.1" r="2.1"/><circle class="crater" cx="2.7" cy="1.5" r="1.5"/><circle class="crater" cx="-.6" cy="3.5" r="1"/><circle class="crater" cx="3.1" cy="-3.2" r=".8"/><circle class="crater" cx="-4.3" cy="1.7" r=".9"/></g>
    </g>
    <path class="r0" d="M0 216 C26 210 48 203 72 198 C92 194 106 186 122 185 C138 184 150 192 166 195 C184 198 198 189 214 181 C228 174 242 171 256 172 C270 173 282 182 298 189 C314 196 330 192 348 184 C366 177 386 179 404 186 C416 190 424 194 430 196 L430 300 L0 300Z"/>
    <path class="r0" d="M255.4 172.3v-9.6h1.2v9.6zM253.6 166h4.8v.9h-4.8z"/>
    <ellipse class="mist drift1" id="mist1" cx="150" cy="222" rx="150" ry="9" filter="url(#fMist)"/>
    <path class="r1" id="hills"/>
    <ellipse class="mist drift2" id="mist2" cx="300" cy="241" rx="170" ry="8" filter="url(#fMist)"/>
    <path class="r2" id="trees"/>
    <path class="r2 back" id="trees2"/>
  </svg></div>
  <div class="switch" id="switch">
    <button data-p="0" class="on">Úlohy</button>
    <button data-p="1">Poznámky</button>
    <button class="sun" id="sunLbl" aria-label="Náhľad dennej doby"></button>
    <span class="line" id="line"></span>
  </div>

  <div class="pager" id="pager">
    <section class="panel" id="pTasks"></section>
    <section class="panel" id="pNotes"></section>
  </div>

  <div class="dock" id="dock">
    <div class="bar"><input id="qi" placeholder="Pridať úlohu" autocomplete="off" enterkeyhint="done">
      <button class="go" id="qgo" aria-label="Pridať"><svg viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11"/></svg></button></div>
    <div class="parse" id="parse">Termín, čas a výkričník napíš rovno do textu</div>
  </div>

  <div class="shade" id="shade"></div>
  <div class="sheet" id="sheet"></div>
  <div class="snack" id="snack"><span id="snackT"></span><button id="snackU">Späť</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=d=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()+d);return x.getTime()};
const diff=t=>Math.round((t-day(0))/864e5);
const DN=['nedeľa','pondelok','utorok','streda','štvrtok','piatok','sobota'];
const DS=['ne','po','ut','st','št','pi','so'];
const MN=['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const LISTS=[{id:'os',n:'Osobné'},{id:'sk',n:'Škola'},{id:'pr',n:'Projekty'}];
const L=id=>LISTS.find(l=>l.id===id)||LISTS[0];

const KEY='jaskyna';
const FRESH=()=>({f:'today',tasks:[],notes:[{id:'n0',pin:true,ts:Date.now(),t:'Ako na Jaskyňu',
  b:'Úlohu pridáš dole. Rovno do textu môžeš napísať termín a čas: „nemčina zajtra o 16“, „basket v piatok 18:30“. Výkričník ju označí ako dôležitú.\n\nPotiahnutím prsta po zozname prepínaš Dnes, 7 dní, Všetko a zoznamy. Za posledným zoznamom sú Poznámky.\n\nÚlohu s termínom pošleš do Google Kalendára v jej detaile cez „Do kalendára“.\n\nVšetko sa ukladá len v tomto zariadení. Na prenos medzi mobilom a počítačom cez Google Disk slúži „Záloha a prenos“ úplne dole v zozname.\n\nTúto poznámku môžeš kľudne vymazať.'}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.tasks))S=FRESH();
/* change tracking for merging backups: each item carries u = time of last change,
   deleted items leave a tombstone in S.deleted so a merge doesn't bring them back */
const KINDS=['tasks','notes'];let SNAP=new Map();
const body=it=>{const {u,...r}=it;return JSON.stringify(r)};

function stamp(){const now=Date.now(),seen=new Set();S.deleted=S.deleted||{};
  KINDS.forEach(k=>S[k].forEach(it=>{const key=k+':'+it.id,j=body(it);seen.add(key);
    if(SNAP.get(key)!==j||!it.u){it.u=now;SNAP.set(key,j)}
    if(S.deleted[key]){delete S.deleted[key];it.u=now}}));
  for(const key of [...SNAP.keys()])if(!seen.has(key)){S.deleted[key]=now;SNAP.delete(key)}

function mergeIn(d){

  let added=0,updated=0;
  KINDS.forEach(k=>{
    const map=new Map(S[k].map(it=>[it.id,it]));
    (d[k]||[]).forEach(it=>{if(!it||!it.id)return;const mine=map.get(it.id);
      const gone=del[k+':'+it.id]>=(it.u||0);
      if(!mine){map.set(it.id,{...it,u:it.u||1});if(!gone)added++}
      else if((it.u||0)>(mine.u||0)){map.set(it.id,it);if(!gone&&body(it)!==body(mine))updated++}});
    S[k]=[...map.values()].filter(it=>!(del[k+':'+it.id]>=(it.u||0)));
  });
  S.deleted=del;snapAll();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

}

function ringSVG(items){
  const c=66,r=58,C=2*Math.PI*r,n=items.length,gap=n>1?5:0,done=items.filter(t=>t.done).length;
  let segs='';
  if(!n)segs=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="4"/>`;
  else{
    const seg=C/n-gap;
    [...items.filter(t=>t.done),...items.filter(t=>!t.done)].forEach((t,i)=>{
      const late=!t.done&&t.due<day(0);
      const col=t.done?'var(--gold)':late?'var(--ember)':'var(--track)';
      segs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${Math.max(seg-2,1)} ${C-seg+2}" stroke-dashoffset="${-(i*C/n+gap/2+1)}" transform="rotate(-90 ${c} ${c})"
        style="stroke:${col};${late?'opacity:.55;':''}transition:stroke .4s ease ${i*40}ms"/>`;
    });
  }
  return `<svg viewBox="0 0 132 132" role="img" aria-label="Hotovo ${done} z ${n} dnešných úloh">${segs}
    <text x="${c}" y="${c+7}" text-anchor="middle" font-family="Jost,-apple-system,system-ui,sans-serif" font-weight="300" font-size="28" style="fill:var(--ivory)">${done}<tspan style="fill:var(--ash2)">/${n}</tspan></text>
    <text x="${c}" y="${c+25}" text-anchor="middle" font-family="Jost,-apple-system,system-ui,sans-serif" font-size="10.5" style="fill:var(--ash)">${n&&done===n?'splnené':'hotovo'}</text>
  </svg>`;
}

let AC;
function chime(all){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,out=AC.createGain(),night=SUN.alt< -6,dusk=SUN.alt<4;out.gain.value=night?.07:dusk?.14:.22;out.connect(AC.destination);
    // a crisp mechanical tick, like a watch crown clicking into place
    const nb=AC.createBuffer(1,AC.sampleRate*.03,AC.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
    const ns=AC.createBufferSource(),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=3000;
    ns.buffer=nb;ns.connect(hp);hp.connect(out);ns.start(t0);
    // then a soft bell
    const pitch=night?.5:dusk?.75:1;const notes=(all?[659.25,783.99,987.77,1318.5]:[1046.5,1567.98]).map(f=>f*pitch);
    notes.forEach((f,i)=>{
      const st=t0+.045+i*(all?.11:.07);
      [1,2.76].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(k?.08:.5,st+.008);g.gain.exponentialRampToValueAtTime(.0001,st+(all?1.6:.9));
        o.connect(g);g.connect(out);o.start(st);o.stop(st+1.7)});
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate(all?[12,60,12,60,24]:12)}catch(e){}
}

const LAT=48.8048,LON=19.6390; // Brezno

function sunAlt(date){

  const g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d;
  const Lm=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,e=(23.439-0.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(Lm),Math.cos(Lm)),dec=Math.asin(Math.sin(e)*Math.sin(Lm));

  return Math.asin(Math.sin(LAT*rad)*Math.sin(dec)+Math.cos(LAT*rad)*Math.cos(dec)*Math.cos(H))/rad;
}
function sunTimes(ref){

  for(let m=5;m<=1440;m+=5){const t=new Date(b.getTime()+m*6e4),a=sunAlt(t);

const GMST=d=>(18.697374558+24.06570982441908*d)%24;
function horiz(ra,dec,date){
  const d=date.getTime()/864e5+2440587.5-2451545.0,H=GMST(d)*15*rad+LON*rad-ra,f=LAT*rad;
  const alt=Math.asin(Math.sin(f)*Math.sin(dec)+Math.cos(f)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(f)-Math.tan(dec)*Math.cos(f))/rad+180;
  return {alt:alt/rad,az};
}
function sunPos(date){
  const d=date.getTime()/864e5+2440587.5-2451545.0,g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d;
  const Lm=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,e=(23.439-0.00000036*d)*rad;
  return horiz(Math.atan2(Math.cos(e)*Math.sin(Lm),Math.cos(Lm)),Math.asin(Math.sin(e)*Math.sin(Lm)),date);

function moonPos(date){

  const L=(218.316+13.176396*d)*rad,M=(134.963+13.064993*d)*rad,F=(93.272+13.229350*d)*rad;
  const lon=L+6.289*rad*Math.sin(M),lat=5.128*rad*Math.sin(F),e=23.4397*rad;
  const ra=Math.atan2(Math.sin(lon)*Math.cos(e)-Math.tan(lat)*Math.sin(e),Math.cos(lon));
  const dec=Math.asin(Math.sin(lat)*Math.cos(e)+Math.cos(lat)*Math.sin(e)*Math.sin(lon));

function moonPath(ph,r){

              :`M0 ${-r} A${r} ${r} 0 0 0 0 ${r} A${rx} ${r} 0 0 ${k<.5?1:0} 0 ${-r}Z`;
}
let MOON={up:false,k:0,ph:0};
function paintSky(now,pal){

  $('moonG').style.opacity=mp.alt>-3?(day>0?.55:1):0;

function dueText(t){

  const d=diff(t.due),x=new Date(t.due);
  if(d<0)return [d===-1?'včera':`pred ${-d} d`,'late'];
  if(d===0)return ['dnes','today'];
  if(d===1)return ['zajtra',''];

/* ---------------- swipe ---------------- */
const ORDER=()=>['today','week','all',...LISTS.map(l=>l.id)];
function goPage(p){$('pager').scrollTo({left:p*$('pager').clientWidth,behavior:'smooth'})}
function stepFilter(dir){ // dir +1 = next (swipe left), -1 = previous
  const o=ORDER(),i=o.indexOf(S.f),n=i+dir;
  if(n<0)return false;
  if(n>=o.length){goPage(1);return true}
  S.f=o[n];menuOpen=false;slideIn=dir>0?'inL':'inR';save();renderTasks();return true;
}
(function(){
  let x0,y0,lock=null,dx=0,target=null;
  const pg=$('pager');
  pg.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('input,textarea,.menu'))return;
    x0=e.clientX;y0=e.clientY;lock=null;dx=0;target=page===0?$('flist'):null;
  });
  pg.addEventListener('pointermove',e=>{
    if(x0==null)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(!lock&&(Math.abs(mx)>10||Math.abs(my)>10))lock=Math.abs(mx)>Math.abs(my)*1.2?'x':'y';
    if(lock!=='x')return;
    dx=mx;
    if(target){const o=ORDER(),atStart=o.indexOf(S.f)===0&&dx>0;target.style.transition='none';target.style.transform=`translateX(${atStart?dx*.25:dx*.6}px)`;target.style.opacity=1-Math.min(Math.abs(dx)/600,.4)}
  });
  const end=()=>{
    if(x0==null)return;
    const wasX=lock==='x',d=dx;x0=null;
    if(target){target.style.transition='transform .25s ease,opacity .25s';target.style.transform='';target.style.opacity=''}
    if(!wasX||Math.abs(d)<55)return;
    if(page===0){const moved=stepFilter(d<0?1:-1);if(moved&&target)target.style.transition='none'}
    else if(d>0){goPage(0)}
  };
  pg.addEventListener('pointerup',end);pg.addEventListener('pointercancel',end);
  // swallow the click that follows a horizontal drag so it doesn't tick a task
  pg.addEventListener('click',e=>{if(lock==='x'){e.stopPropagation();e.preventDefault();lock=null}},true);
})();

function parse(s){
  let t=' '+s+' ',due=S.f==='today'?0:null,hi=false,l=LISTS.some(x=>x.id===S.f)?S.f:'os';
  const R=[[/\s(dnes)\s/i,0],[/\s(zajtra)\s/i,1],[/\s(pozajtra)\s/i,2],[/\s(o týždeň)\s/i,7]];
  for(const [r,d] of R)if(r.test(t)){due=d;t=t.replace(r,' ')}
  DN.forEach((dn,i)=>{const r=new RegExp('\\s(v |vo )?'+dn+'\\s','i');if(r.test(t)){let d=(i-new Date().getDay()+7)%7||7;due=d;t=t.replace(r,' ')}});
  let time=null;
  const tr=t.match(/\s(?:o\s+|o\s*)?(\d{1,2})(?::|\.)(\d{2})(?=\s)/i)||t.match(/\so\s+(\d{1,2})(?=\s)/i);
  if(tr){const h=+tr[1],m=tr[2]?+tr[2]:0;if(h<24&&m<60){time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');t=t.replace(tr[0],' ');if(due==null)due=0}}
  if(/!/.test(t)){hi=true;t=t.replace(/!+/g,'')}
  LISTS.forEach(x=>{const r=new RegExp('\\s#'+x.n+'\\s','i');if(r.test(t)){l=x.id;t=t.replace(r,' ')}});
  return {t:t.replace(/\s+/g,' ').trim(),due,hi,l,time};
}
function updParse(){
  const v=$('qi').value.trim(),el=$('parse');
  if(page){el.textContent=v?'Enter otvorí novú poznámku':'Napíš názov a stlač Enter';return}
  if(!v){el.textContent='Termín, čas a výkričník napíš rovno do textu';return}
  const r=parse(v),dl=r.due==null?'bez termínu':r.due===0?'dnes':r.due===1?'zajtra':r.due===2?'pozajtra':(()=>{const x=new Date(day(r.due));return DN[x.getDay()]+' '+x.getDate()+'.'})();
  el.innerHTML=`<b>${dl}${r.time?' o '+r.time:''}</b>${r.hi?', <b>dôležité</b>':''}, ${L(r.l).n}`;
}
$('qi').oninput=updParse;
function submit(){
  const v=$('qi').value.trim();if(!v)return;
  if(page){const n={id:'n'+Date.now(),t:v,b:'',pin:false,ts:Date.now()};S.notes.push(n);save();$('qi').value='';updParse();renderNotes();openNote(n,true);return}
  const r=parse(v);if(!r.t)return;
  S.tasks.push({id:'t'+Date.now(),t:r.t,l:r.l,hi:r.hi,due:r.due==null?null:day(r.due),time:r.time,done:false,note:''});
  save();$('qi').value='';updParse();renderTasks();snack('Úloha pridaná');
}

    if(s.dataset.s==='del'){const i=S.tasks.indexOf(t);S.tasks.splice(i,1);save();snack('Úloha vymazaná',()=>{S.tasks.splice(i,0,t);save();renderTasks()})}
    closeSheet();renderTasks();
  };

function calLink(t){
  const p=n=>String(n).padStart(2,'0'),d=new Date(t.due),ymd=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}`;

function openBackup(){

function openNote(n,focusBody){
  openSheet(`<div class="sbar"><button class="l" data-s="pin">${n.pin?'Odopnúť':'Pripnúť'}</button><button data-close data-s="ok">Hotovo</button></div>
    <input class="ti" id="nt" placeholder="Názov" value="${esc(n.t)}"><textarea class="tx" id="nb" placeholder="Píš">${esc(n.b)}</textarea>
    <button class="del" data-s="del">Vymazať poznámku</button>`,true);
  const up=()=>{n.t=$('nt').value;n.b=$('nb').value;n.ts=Date.now();save()};
  $('nt').oninput=up;$('nb').oninput=up;
  if(focusBody)setTimeout(()=>$('nb').focus(),420);
  $('sheet').onclick=e=>{const s=e.target.closest('[data-s]');if(!s)return;
    if(s.dataset.s==='pin'){n.pin=!n.pin;save();s.textContent=n.pin?'Odopnúť':'Pripnúť';return}
    if(s.dataset.s==='del'){const i=S.notes.indexOf(n);S.notes.splice(i,1);save();snack('Poznámka vymazaná',()=>{S.notes.splice(i,0,n);save();renderNotes()})}
    else if(!n.t.trim()&&!n.b.trim()){S.notes=S.notes.filter(x=>x!==n);save()}
    closeSheet();renderNotes();
  };
}

let snT;function snack(m,undo){$('snackT').textContent=m;$('snackU').style.display=undo?'':'none';$('snack').classList.add('on');
  $('snackU').onclick=()=>{$('snack').classList.remove('on');undo&&undo()};clearTimeout(snT);snT=setTimeout(()=>$('snack').classList.remove('on'),3000)}

applySun();renderTasks();renderNotes();setLine(0);
document.fonts&&document.fonts.ready.then(()=>setLine(page));
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
